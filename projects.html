    <script>
      (function () {
        var grid = document.getElementById("projects-grid");
        if (!grid) return;

        var fallbackProjects = [
          {
            "id": "sales-eda-practice",
            "title": "Sales EDA Practice Project",
            "description": "Exploratory data analysis on a global sales dataset using Python, Pandas, NumPy, and Matplotlib. Analyzes order distributions, channel splits, regional performance, and revenue trends with visual insights.",
            "technologies": ["Python", "Pandas", "NumPy", "Matplotlib", "Seaborn", "Jupyter"],
            "github": "https://github.com/UjJwAl092003/sales-eda-practice",
            "featured": true,
            "date": "2026-08-25"
          },
          {
            "id": "book-sales-analysis",
            "title": "Book Sales & Ratings Analysis",
            "description": "Exploratory data analysis of a multi-genre book catalog, examining pricing patterns, author reputation tiers, genre performance, and sales volume trends to extract practical publisher insights.",
            "technologies": ["Python", "Pandas", "NumPy", "Matplotlib", "Seaborn", "Jupyter"],
            "github": "https://github.com/UjJwAl092003/portfolio-ujjwal/tree/main/projects/book-sales-analysis",
            "liveDemo": "projects/book-sales-analysis.html",
            "featured": true,
            "date": "2026-07-20"
          },
          {
            "id": "ai-playground",
            "title": "AI Playground",
            "description": "An interactive learning platform for practicing Python, NumPy, Pandas, and Machine Learning concepts through MCQs, coding exercises, and assessments. Features 300+ MCQs, 30+ hands-on coding exercises, automated tests, and progress tracking.",
            "technologies": ["Python", "Django", "NumPy", "Pandas", "Scikit-learn"],
            "github": "https://github.com/UjJwAl092003/ai-playground",
            "featured": true,
            "date": "2026-07-01"
          }
        ];

        function renderProjects(projects) {
          if (!projects || projects.length === 0) {
            grid.innerHTML =
              '<article><div class="content"><h3>No projects yet</h3><p>Projects will be added soon.</p></div></article>';
            return;
          }

          grid.innerHTML = projects
            .map(function (p) {
              var techs = (p.technologies || [])
                .map(function (t) {
                  return '<span class="tech-badge">' + t + "</span>";
                })
                .join("");
              var detailUrl = p.liveDemo || p.github || ("projects/" + p.id + ".html");
              var isExternal = detailUrl.startsWith("http://") || detailUrl.startsWith("https://");
              var targetAttr = isExternal ? ' target="_blank" rel="noopener"' : '';
              return (
                '<article>' +
                '<div class="content" style="padding-top: 0.25rem;">' +
                '<h3 style="margin-bottom: 0.35rem;"><a href="' + detailUrl + '"' + targetAttr + '>' +
                p.title +
                "</a></h3>" +
                '<p style="margin: 0.5rem 0 0.75rem 0; font-size: 0.95rem; color: inherit;">' +
                p.description +
                "</p>" +
                '<div style="margin-bottom: 1rem; display: flex; flex-wrap: wrap; gap: 0.4rem;">' +
                techs +
                "</div>" +
                '<ul class="actions">' +
                '<li><a href="' +
                detailUrl +
                '" class="button"' + targetAttr + '>View Project</a></li>' +
                "</ul>" +
                "</div>" +
                "</article>"
              );
            })
            .join("");
        }

        fetch("data/projects.json")
          .then(function (res) {
            if (!res.ok) throw new Error("Failed to load projects");
            return res.json();
          })
          .then(function (projects) {
            renderProjects(projects);
          })
          .catch(function () {
            renderProjects(fallbackProjects);
          });
      })();
    </script>
